# Live reload for local development: `air` (run from backend/) rebuilds and
# restarts the API whenever Go code, SQL migrations/seed files, the OpenAPI
# spec or .env change. Production (Docker) is unaffected.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  # Flags passed to the API, e.g. ["-seed"].
  args_bin = []
  # .sql and .yaml are embedded into the binary, so they need a rebuild too.
  include_ext = ["go", "sql", "yaml"]
  include_file = [".env"]
  exclude_dir = ["tmp", "bin", "vendor"]
  exclude_regex = ["_test\\.go$"]
  # Wait for a burst of saves to settle before rebuilding.
  delay = 500
  # Keep the old server running if the new code doesn't compile.
  stop_on_error = true
  # Ctrl+C-style shutdown so in-flight requests and messages finish.
  send_interrupt = true
  kill_delay = "5s"
  rerun = false

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
